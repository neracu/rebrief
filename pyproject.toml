[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrief"
dynamic = ["version"]
description = "CLI utility for locally auditing AI-generated repositories and generating REBRIEF.md handoff reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/neracu/rebrief"
Issues = "https://github.com/neracu/rebrief/issues"

[project.scripts]
rebrief = "rebrief.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "colorama>=0.4",
    "mcp>=2.0,<3",
    "tiktoken>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "httpx>=0.27",
]
mcp = ["mcp>=2.0,<3"]
tokens = ["tiktoken>=0.7"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "slowapi>=0.1.9", "redis>=5.0"]
publish = ["build>=1.0", "twine>=5.0"]

[tool.setuptools.dynamic]
version = { attr = "rebrief.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["rebrief*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"rebrief.webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
