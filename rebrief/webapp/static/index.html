<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rebrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --accent: #10b981;
      --danger: #f87171;
      --sans: Inter, ui-sans-serif, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 13px;
      min-height: 100%;
    }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
    .sub { color: var(--muted); font-size: 12px; margin: 0.2rem 0 0; }
    form { margin-top: 1.15rem; }
    .row { display: flex; gap: 0.4rem; }
    @media (max-width: 640px) { .row { flex-direction: column; } }
    input[type="text"] {
      flex: 1;
      height: 2rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      border-radius: 0.3rem;
      padding: 0 0.6rem;
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: #71717a; }
    button { font-family: inherit; cursor: pointer; }
    .primary {
      height: 2rem;
      border: 0;
      border-radius: 0.3rem;
      background: var(--fg);
      color: var(--bg);
      font-size: 12px;
      font-weight: 500;
      padding: 0 0.75rem;
      white-space: nowrap;
    }
    .primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .examples { display: flex; flex-wrap: wrap; gap: 0.2rem 0.85rem; margin: 0.5rem 0 0; font-size: 11px; }
    .examples button {
      background: none;
      border: 0;
      padding: 0;
      color: var(--muted);
      font-family: var(--mono);
      text-decoration: none;
    }
    .examples button:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
    .stack { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.3rem; overflow: hidden; }
    .log-head, .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
    }
    .label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .log { list-style: none; margin: 0; padding: 0.5rem 0.6rem; font-family: var(--mono); font-size: 11px; line-height: 1.45; }
    .log li { display: flex; gap: 0.75rem; color: #52525b; }
    .log .pfx { width: 1rem; text-align: right; flex-shrink: 0; }
    .log .ok { color: var(--accent); }
    .log .run { color: var(--fg); }
    .log .err { color: var(--danger); }
    .hidden { display: none !important; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.75rem;
      padding: 0.4rem 0.6rem;
      font-size: 11px;
    }
    .stats .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .accent { color: var(--accent); }
    .danger { color: var(--danger); }
    .tags { display: flex; flex-wrap: wrap; gap: 0.375rem; list-style: none; margin: 0; padding: 0; }
    .tags li {
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      padding: 0.125rem 0.375rem;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }
    .ml { margin-left: auto; }
    .tabs { display: flex; border: 1px solid var(--border); border-radius: 0.25rem; padding: 2px; }
    .tabs button, .tool {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 11px;
      padding: 0.15rem 0.45rem;
      border-radius: 0.125rem;
    }
    .tabs button.on { background: var(--accent); color: var(--bg); font-weight: 500; }
    .tool {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 11px;
      border-radius: 0.25rem;
      padding: 0.15rem 0.45rem;
    }
    .tool:hover { border-color: var(--muted); }
    .tool.on { border-color: var(--accent); color: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-left: auto; }
    .body { max-height: 70vh; overflow: auto; padding: 0.75rem 0.85rem; }
    .raw {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
    }
    footer { margin-top: auto; padding-top: 2rem; font-size: 11px; color: var(--muted); }
    footer code { font-family: var(--mono); }
    .md { font-size: 12px; line-height: 1.5; }
    .md h1, .md h2, .md h3 { font-weight: 600; letter-spacing: -0.02em; margin: 0.75rem 0 0.3rem; }
    .md h1 { font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
    .md h2 { font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
    .md h3 { font-size: 12px; }
    .md p, .md ul, .md ol { margin: 0.3rem 0; }
    .md ul, .md ol { padding-left: 1.1rem; }
    .md code {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      padding: 0.1rem 0.35rem;
    }
    .md pre {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      padding: 0.5rem 0.7rem;
      overflow-x: auto;
    }
    .md pre code { background: none; border: 0; padding: 0; }
    .md blockquote {
      border-left: 3px solid var(--accent);
      color: var(--muted);
      margin: 0.45rem 0;
      padding: 0.15rem 0 0.15rem 0.85rem;
    }
    .md a { color: var(--accent); }
    .chat-card { margin-top: 0.75rem; }
    .chat-head { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); }
    .chat-head p { margin: 0.15rem 0 0; color: var(--muted); font-size: 11px; }
    .chat-creds { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    .chat-creds input {
      flex: 1;
      min-width: 8rem;
      height: 1.85rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 0.3rem;
      padding: 0 0.5rem;
      font-family: var(--mono);
      font-size: 11px;
    }
    .chat-log { max-height: 18rem; overflow: auto; padding: 0.6rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .bubble { border: 1px solid var(--border); border-radius: 0.3rem; padding: 0.4rem 0.55rem; font-size: 12px; line-height: 1.45; }
    .bubble.user { align-self: flex-end; background: var(--bg); max-width: 90%; }
    .bubble.assistant { background: transparent; }
    .chat-form { display: flex; gap: 0.4rem; padding: 0.5rem 0.6rem; border-top: 1px solid var(--border); }
    .chat-form input[type="text"] { flex: 1; height: 2rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>rebrief</h1>
      <p class="sub">Repository summarizer for LLMs &amp; AI agents.</p>
    </header>
    <form id="form">
      <div class="row">
        <input id="url" type="text" placeholder="https://github.com/owner/repository" spellcheck="false" autocomplete="off">
        <button class="primary" id="submit" type="submit" disabled>Generate REBRIEF</button>
      </div>
      <p class="examples">
        <button type="button" data-example="fastapi/fastapi">fastapi/fastapi</button>
        <button type="button" data-example="vercel/next.js">vercel/next.js</button>
        <button type="button" data-example="expressjs/express">expressjs/express</button>
      </p>
    </form>
    <div class="stack">
      <section id="log-card" class="card hidden">
        <div class="log-head">
          <span class="label">scan log</span>
          <span class="label" id="elapsed">00:00</span>
        </div>
        <ol class="log" id="log"></ol>
      </section>
      <section id="results" class="hidden"></section>
    </div>
    <footer>Local CLI: <code>pip install rebrief</code></footer>
  </main>
  <script>
    const STEPS = [
      "Resolving HEAD",
      "Cloning --depth 50",
      "[1/4] Parsing repository manifests & tech stack...",
      "[2/4] Analyzing git history & hotspots...",
      "[3/4] Running risk detectors & confidence checks...",
      "[4/4] Calculating token metrics & generating report...",
    ];
    const PROMPT = "Read the following REBRIEF.md before starting to understand the project's architecture and hotspots.";

    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const submit = document.getElementById("submit");
    const logCard = document.getElementById("log-card");
    const logEl = document.getElementById("log");
    const elapsedEl = document.getElementById("elapsed");
    const results = document.getElementById("results");

    let scanning = false;
    let step = 0;
    let startedAt = 0;
    let tick = null;
    let advance = null;
    let chatMessages = [];
    let chatBusy = false;
    let chatApiKey = "";
    let chatModel = "openai/gpt-4o-mini";
    let lastRepoUrl = "";

    urlInput.addEventListener("input", () => {
      submit.disabled = scanning || !urlInput.value.trim();
    });

    document.querySelectorAll("[data-example]").forEach((btn) => {
      btn.addEventListener("click", () => runScan(btn.getAttribute("data-example")));
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      runScan(urlInput.value);
    });

    function formatElapsed(ms) {
      const total = Math.floor(ms / 1000);
      const m = String(Math.floor(total / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function formatCompact(count) {
      if (count >= 1e6) {
        return String((count / 1e6).toFixed(1)).replace(/\.0$/, "") + "M";
      }
      if (count >= 1000) {
        return String((count / 1000).toFixed(1)).replace(/\.0$/, "") + "k";
      }
      return String(count);
    }

    function renderLog(done, error) {
      logEl.innerHTML = "";
      STEPS.forEach((text, index) => {
        const li = document.createElement("li");
        const isDone = done || index < step;
        const isCurrent = !done && !error && index === step;
        let pfx = "  ";
        if (isDone) { pfx = "ok"; li.className = "ok"; }
        else if (isCurrent) { pfx = ">"; li.className = "run"; }
        li.innerHTML = '<span class="pfx"></span><span></span>';
        li.children[0].textContent = pfx;
        li.children[1].textContent = text;
        logEl.appendChild(li);
      });
      if (error) {
        const li = document.createElement("li");
        li.className = "err";
        li.innerHTML = '<span class="pfx">!</span><span></span>';
        li.children[1].textContent = error;
        logEl.appendChild(li);
      }
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function inlineMd(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(src) {
      const lines = src.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let i = 0;
      let list = null;
      function closeList() {
        if (list) { out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; }
      }
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          closeList();
          const buf = [];
          i += 1;
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(escapeHtml(lines[i]));
            i += 1;
          }
          out.push("<pre><code>" + buf.join("\n") + "</code></pre>");
          i += 1;
          continue;
        }
        const heading = /^(#{1,3})\s+(.*)$/.exec(line);
        if (heading) {
          closeList();
          const n = heading[1].length;
          out.push("<h" + n + ">" + inlineMd(heading[2]) + "</h" + n + ">");
          i += 1;
          continue;
        }
        if (line.startsWith("> ")) {
          closeList();
          out.push("<blockquote><p>" + inlineMd(line.slice(2)) + "</p></blockquote>");
          i += 1;
          continue;
        }
        const ul = /^[-*]\s+(.*)$/.exec(line);
        if (ul) {
          if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
          out.push("<li>" + inlineMd(ul[1]) + "</li>");
          i += 1;
          continue;
        }
        const ol = /^\d+\.\s+(.*)$/.exec(line);
        if (ol) {
          if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
          out.push("<li>" + inlineMd(ol[1]) + "</li>");
          i += 1;
          continue;
        }
        closeList();
        if (line.trim() === "") { i += 1; continue; }
        out.push("<p>" + inlineMd(line) + "</p>");
        i += 1;
      }
      closeList();
      return out.join("\n");
    }

    function formatDetail(payload, status) {
      const detail = payload && payload.detail;
      if (typeof detail === "string" && detail.trim()) return detail;
      if (status === 429) return "Rate limit exceeded: 10 scans per minute per IP.";
      if (status === 504) return "Scan timed out.";
      return "Scan failed (" + status + ").";
    }

    function renderResults(data) {
      const stats = data.token_stats;
      const tags = []
        .concat(data.tech_stack.languages || [])
        .concat(data.tech_stack.frameworks || [])
        .concat(data.tech_stack.manifests || []);
      const critClass = data.risks.critical > 0 ? "danger" : "";
      results.className = "";
      results.innerHTML =
        '<div class="card stats">' +
          '<p class="mono"><span class="muted">' + formatCompact(stats.raw_codebase_tokens) +
          ' raw</span> → <span>' + Number(stats.brief_tokens).toLocaleString() +
          ' brief</span><span class="muted"> | </span><span class="accent">' +
          Number(stats.savings_percentage).toFixed(1) + '% saved</span></p>' +
          '<p class="muted"><span class="' + critClass + '">' + data.risks.critical +
          ' Critical</span> / <span>' + data.risks.warning + ' Warnings</span></p>' +
          (tags.length ? '<ul class="tags">' + tags.map((t) => "<li>" + escapeHtml(t) + "</li>").join("") + "</ul>" : "") +
          (data.cached ? '<span class="ml label accent">cached</span>' : "") +
        "</div>" +
        '<div class="card" style="margin-top:0.75rem">' +
          '<div class="toolbar">' +
            '<div class="tabs">' +
              '<button type="button" class="on" data-tab="preview">Formatted Preview</button>' +
              '<button type="button" data-tab="raw">Raw Markdown</button>' +
            "</div>" +
            '<div class="actions">' +
              '<button type="button" class="tool" data-act="copy">Copy to Clipboard</button>' +
              '<button type="button" class="tool" data-act="download">Download REBRIEF.md</button>' +
              '<button type="button" class="tool" data-act="prompt">Copy Prompt for Cursor/Claude</button>' +
            "</div>" +
          "</div>" +
          '<div class="body"><div class="md" id="preview"></div><pre class="raw hidden" id="raw"></pre></div>' +
        "</div>" +
        '<div class="card chat-card" id="chat-card">' +
          '<div class="chat-head">' +
            "<strong>Ask this repo</strong>" +
            "<p>BYO API key is kept in memory only and is never stored.</p>" +
          "</div>" +
          '<div class="chat-creds">' +
            '<input id="chat-model" type="text" spellcheck="false" placeholder="openai/gpt-4o-mini">' +
            '<input id="chat-key" type="password" autocomplete="off" placeholder="API key (optional if the server has env keys)">' +
          "</div>" +
          '<div class="chat-log" id="chat-log"></div>' +
          '<form class="chat-form" id="chat-form">' +
            '<input id="chat-input" type="text" placeholder="Ask about this repo’s architecture, hotspots, or risks…" autocomplete="off">' +
            '<button class="primary" id="chat-send" type="submit">Send</button>' +
          "</form>" +
        "</div>";
      document.getElementById("preview").innerHTML = renderMarkdown(data.markdown);
      document.getElementById("raw").textContent = data.markdown;
      bindChat(data);

      results.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tab = btn.getAttribute("data-tab");
          results.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b === btn));
          document.getElementById("preview").classList.toggle("hidden", tab !== "preview");
          document.getElementById("raw").classList.toggle("hidden", tab !== "raw");
        });
      });

      const prompt = PROMPT + "\n\n---\n" + data.markdown;
      results.querySelectorAll("[data-act]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const act = btn.getAttribute("data-act");
          if (act === "download") {
            const blob = new Blob([data.markdown], { type: "text/markdown;charset=utf-8" });
            const href = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = href;
            a.download = "REBRIEF.md";
            a.click();
            URL.revokeObjectURL(href);
            return;
          }
          const text = act === "prompt" ? prompt : data.markdown;
          await navigator.clipboard.writeText(text);
          const prev = btn.textContent;
          btn.textContent = "Copied";
          btn.classList.add("on");
          setTimeout(() => { btn.textContent = prev; btn.classList.remove("on"); }, 1500);
        });
      });
    }

    async function runScan(target) {
      const trimmed = (target || "").trim();
      if (!trimmed || scanning) return;
      urlInput.value = trimmed;
      lastRepoUrl = trimmed;
      scanning = true;
      submit.disabled = true;
      step = 0;
      startedAt = Date.now();
      results.className = "hidden";
      results.innerHTML = "";
      logCard.classList.remove("hidden");
      renderLog(false, null);
      elapsedEl.textContent = "00:00";
      clearInterval(tick);
      clearTimeout(advance);
      tick = setInterval(() => {
        elapsedEl.textContent = formatElapsed(Date.now() - startedAt);
      }, 250);
      advance = setTimeout(() => {
        if (scanning && step < 1) { step = 1; renderLog(false, null); }
      }, 300);

      let error = null;
      let data = null;
      try {
        const response = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: trimmed, min_confidence: "medium" }),
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok) throw new Error(formatDetail(payload, response.status));
        if (!payload || typeof payload.markdown !== "string") throw new Error("Unexpected response from scan API.");
        data = payload;
        step = STEPS.length - 1;
      } catch (err) {
        error = err instanceof Error ? err.message : "Scan failed.";
      } finally {
        scanning = false;
        submit.disabled = !urlInput.value.trim();
        elapsedEl.textContent = formatElapsed(Date.now() - startedAt);
        clearInterval(tick);
        clearTimeout(advance);
        renderLog(Boolean(data), error);
        if (data) renderResults(data);
      }
    }

    function bindChat(data) {
      chatMessages = [];
      chatBusy = false;
      const modelInput = document.getElementById("chat-model");
      const keyInput = document.getElementById("chat-key");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      modelInput.value = chatModel;
      keyInput.value = chatApiKey;
      modelInput.addEventListener("input", () => { chatModel = modelInput.value; });
      keyInput.addEventListener("input", () => { chatApiKey = keyInput.value; });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendChat(input.value, data);
        input.value = "";
      });
    }

    function appendBubble(role, text) {
      const log = document.getElementById("chat-log");
      const div = document.createElement("div");
      div.className = "bubble " + role;
      if (role === "assistant") div.className += " md";
      if (role === "assistant") div.innerHTML = renderMarkdown(text || "…");
      else div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function sendChat(question, data) {
      const trimmed = (question || "").trim();
      if (!trimmed || chatBusy) return;
      chatBusy = true;
      document.getElementById("chat-send").disabled = true;
      chatMessages.push({ role: "user", content: trimmed });
      appendBubble("user", trimmed);
      const bubble = appendBubble("assistant", "");
      let reply = "";
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repo_url: lastRepoUrl,
            messages: chatMessages,
            api_key: chatApiKey || undefined,
            model: (chatModel || "").trim() || undefined,
          }),
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => null);
          throw new Error(formatDetail(payload, response.status));
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const part of parts) {
            const line = part.split("\n").find((row) => row.startsWith("data:"));
            if (!line) continue;
            const payload = JSON.parse(line.slice(5).trim());
            if (payload.error) throw new Error(payload.error);
            if (payload.delta) {
              reply += payload.delta;
              bubble.innerHTML = renderMarkdown(reply);
            }
          }
        }
        if (reply) chatMessages.push({ role: "assistant", content: reply });
        else bubble.textContent = "(empty reply)";
      } catch (err) {
        bubble.className = "bubble assistant err";
        bubble.textContent = err instanceof Error ? err.message : "Chat failed.";
        chatMessages.pop();
      } finally {
        chatBusy = false;
        document.getElementById("chat-send").disabled = false;
      }
    }
  </script>
</body>
</html>
